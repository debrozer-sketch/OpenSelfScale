# Отключение гашения/DPMS на киоск-экране: Xorg по умолчанию гасит
# монитор по таймерам (blank 600 с, DPMS standby) — на весах это выглядело
# как «экран затухает, тап возвращает картинку». Класть в
# /etc/X11/xorg.conf.d/10-noblank.conf.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
