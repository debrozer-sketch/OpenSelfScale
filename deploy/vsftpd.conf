# OpenScale FTP: приём выгрузки товаров от сервера магазина.
# Пользователь scale создаётся install.sh; домашний каталог /var/ftp (chroot),
# файлы кладутся в подкаталог scale/.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
chroot_local_user=YES
allow_writeable_chroot=NO
ftpd_banner=OpenScale FTP
pam_service_name=vsftpd
utf8_filesystem=YES
xferlog_enable=YES
connect_from_port_20=NO
