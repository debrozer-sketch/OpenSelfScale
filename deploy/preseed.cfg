# Preseed установки Debian 13 на весы OpenScale (wipe + чистая система).
# Зашивается в initrd (deploy/make_initrd.py), срабатывает от
# kernel cmdline: auto=true priority=critical.
# Диск /dev/sda размечается с нуля: ESP + swap + root ext4.

#### Локализация / время
d-i debian-installer/locale string ru_RU.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, ru_RU.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select ru
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Novosibirsk
d-i clock-setup/ntp boolean false

#### Сеть: статика в LAN весов (DHCP в сети отсутствует)
d-i netcfg/choose_interface select eth0
d-i netcfg/disable_dhcp boolean true
d-i netcfg/get_ipaddress string 192.0.2.10
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string __MIRROR_IP__
d-i netcfg/get_nameservers string __MIRROR_IP__
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string scales
d-i netcfg/get_domain string local

#### Пароль root (подставляется make_initrd.py из .env; файл в initrd старой
#### системы уничтожается вместе с ней)
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password string __ROOT_PW__
d-i passwd/root-password-again string __ROOT_PW__

#### Часы через NTP не нужны: сеть изолирована

#### Разметка: ПОЛНАЯ переразметка /dev/sda, ничего от старой системы
d-i partman/early_command string \
    umount /media || true
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-auto/expert_recipe string \
    openscale :: \
        512 512 512 fat32 $primary{ } method{ efi } format{ } . \
        1024 1024 1024 linux-swap $primary{ } method{ swap } format{ } . \
        8000 20000 -1 ext4 $primary{ } method{ format } format{ } mountpoint{ / } .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-swapfile/size string 0

#### apt: пакеты с этого ПК (HTTP, LAN); никаких внешних репозиториев
d-i mirror/country string manual
d-i mirror/http/hostname string __MIRROR_IP__
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/services-select multiselect none
d-i apt-setup/security_host string
d-i apt-setup/volatile_host string
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/update-policy select none
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server mc

#### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/with_other_os boolean false

#### Финал: root SSH по паролю (внутри LAN), отключаем ede-подсказки
d-i preseed/late_command string \
    in-target sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config ; \
    in-target systemctl disable e2scrub_reap.service || true ; \
    echo 'OpenScale Debian 13 golden baseline' > /etc/motd
d-i debian-installer/exit/poweroff boolean false
d-i debian-installer/add-kernel-opts string console=tty0
