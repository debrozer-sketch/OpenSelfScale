# Пример config.toml устройства ScaleFW.
# Путь по умолчанию: /etc/scalefw/config.toml.
# Все поля необязательны: пропуск = значение по умолчанию (эталонная весы).

[scales]
kind = "shtrih-slim"        # имя драйвера из фабрики (crates/)
port = "/dev/scales"        # udev-алиас NXP тензомодуля
baud = 115200

[printer]
kind = "escpos"
port = "/dev/ttyS3"
baud = 19200

# Поведение после печати этикетки:
# true  — сразу вернуться на главный экран (по умолчанию),
# false — остаться в выбранном разделе.
#[kiosk]
#return_to_root_after_print = true
#idle_timeout_secs = 60

# Ключи БЕЗ секции — только до первого [заголовка], иначе TOML отнесёт их
# к предыдущей таблице и киоск молча возьмёт дефолт.
# Приём данных и хранилище:
incoming_dir = "/var/ftp/scale"
db_path = "/home/scales/plu.db"
log_file = "/var/log/scalefw/kiosk.log"

# Приём выгрузки «как старое ПО»: сервер магазина сам пушит plu.xml/layout.xml
# и ready.flg в incoming_dir (FTP-сервер весов, chroot /var/ftp), lftp-зеркало
# привозит картинки <PLU>.jpg. Киоск следит за каталогом, после обработки
# каталог остаётся пустым, XML архивируются в history_dir.
#[center]
#protocol = "drop"            # приём из incoming_dir по флагу ready.flg
#img_local_dir = "/etc/scalefw/img"
#history_dir = "/var/lib/scalefw/history"

# Альтернатива: киоск сам забирает данные по FTP (protocol = "ftp") —
# заполните host/user/password/plu_path.

# Пример профиля другой платформы — просто другие значения:
# [scales]
# kind = "sometech-x"
# port = "/dev/ttyUSB0"
# baud = 9600
